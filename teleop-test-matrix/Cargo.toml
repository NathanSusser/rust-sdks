[package]
name = "teleop-test-matrix"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "teleop-harness"
path = "src/main.rs"

[dependencies]
livekit = { workspace = true, features = ["rustls-tls-native-roots"] }
livekit-api = { workspace = true }
livekit-datatrack = { workspace = true }
tokio = { workspace = true, features = ["full", "parking_lot"] }
futures-util = { workspace = true, default-features = false, features = ["sink"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
parking_lot = { workspace = true }
# Camera capture (--camera-source). Pinned to the same revision and feature set as
# `examples/local_video`, whose capture path this harness reuses: two revisions of nokhwa
# in one workspace would give the two binaries different device enumeration.
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["output-threaded"] }
yuv-sys = { workspace = true, features = ["jpeg"] }
image = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["input-avfoundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["input-msmf"] }
