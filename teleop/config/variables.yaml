# Every variable a grid may set. A grid file that names anything else is rejected.
# `applies` says how the value reaches the run, so a label can only describe what ran.
codec:
  type: enum
  values: [h264, av1, h265]
  applies: harness --codec
  note: h265 is admitted but its NVENC path has not been given the frame-size cap or padding
kbps:
  type: int
  min: 128
  max: 20000
  optional: true            # derived from resolution/fps/bpp when not set
  applies: harness --max-bitrate (x1000) and LK_MAX_START_BITRATE_KBPS
  note: >-
    fixed resolution + bpp -> kbps = round(W*H*fps*bpp/1000); fixed resolution + kbps -> bpp is
    derived; resolution auto needs kbps. Setting both bpp and kbps on a fixed resolution is rejected.
    A derived kbps must still land in 128..20000.
fps:
  type: int
  values: [30, 25, 20, 15, 12, 10]
  applies: harness --fps
resolution:
  type: resolution          # "auto" or "WxH", each side 128..1920 and even
  default: auto
  applies: harness --width --height ; auto derives from kbps/fps/bpp (grid.derive_geometry)
  note: >-
    the clip is 1600x1300; an aspect more than 2% off it is scaled/stretched (warned, not rejected).
    Sides that are not multiples of 16 are warned.
geometry:
  type: geometry
  deprecated: resolution    # accepted in grid files with a warning and read as `resolution`
  applies: see resolution
bpp:
  type: float
  min: 0.01
  max: 0.5
  optional: true            # derived from kbps on a fixed resolution; 0.10 for auto when not set
  applies: kbps derivation (fixed resolution) or geometry derivation (auto)
vbv_frames:
  type: int
  min: 1
  max: 30
  default: 1
  applies: env LK_NVENC_VBV_FRAMES
padding:
  type: bool
  default: true
  applies: env LK_NVENC_FILLER (1/0)
target_quality:
  type: int_or_off          # off, or QP 1..51
  default: off
  applies: env LK_NVENC_TARGET_QUALITY (unset when off)
intra_refresh:
  type: int
  min: 0
  max: 600
  default: 0
  applies: env LK_NVENC_INTRA_REFRESH_FRAMES
pin_bitrate:
  type: bool
  default: true
  applies: env LK_PIN_BITRATE_TO_MAX (1/0)
duration_s:
  type: int
  min: 30
  max: 3600
  default: 300
  applies: harness --duration-s ; capture span = lead_s + duration_s + 30
repeats:
  type: int
  min: 1
  max: 20
  default: 3
  applies: grid expansion
clip:
  type: path
  applies: harness --camera-source
lead_s:
  type: int
  min: 20
  max: 300
  default: 60
  applies: seconds between arming and the publish epoch
cooldown_s:
  type: int
  min: 0
  max: 600
  default: 30
  applies: gap after a cell closes before the next pre-flight
screenshots:
  type: int
  min: 0
  max: 20
  default: 0                # off
  applies: >-
    subscriber --sample-frames-dir hostb/frames --sample-every N, N = max(1, floor(fps*duration_s/screenshots))
    (recorded as sample_every in the cell's values). Not part of the label.
  note: >-
    sampling is by frame ID, so a cell yields about `screenshots` raw I420 frames (~3 MB each at
    1600x1300), a hole where a sampled frame was lost. reduce writes reduced/screens/*.png.
